name: stock_compare
description: "Compare stocks"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  ethan_sync:
    path: ../ethan_sync
  ethan_ui:
    path: ../ethan_ui
  ethan_utils:
    path: ../ethan_utils
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_riverpod: ^3.4.2
  intl: ^0.20.2
  path: ^1.9.0
  path_provider: ^2.1.4
  powersync: ^1.16.2
  shared_preferences: ^2.5.4
  sqlite3_flutter_libs: ^0.5.41
  uuid: ^4.5.1
  yahoo_finance_data_reader: ^1.0.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  sqlite3_flutter_libs: 0.5.41
  powersync: 1.16.2
  path_provider_foundation: 2.5.1

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  ios:
    generate: true
    remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
